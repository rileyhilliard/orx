# bun test is the only test runner. A bare `bun test` (or `bun run test`) runs everything under
# tests/: the unit tests and tests/tui, in one process. e2e/ is outside the root on purpose: it
# needs a fresh dist/orx, so it runs through `bun run e2e`, which builds first.
[test]
root = "./tests"
# Blanks the key, points every network URL at an unreachable port, and moves config, data,
# and logs into temp dirs. bun auto-loads .env, so this must run before any test code.
preload = ["./tests/setup.ts"]
# `bun run coverage`: a report on the app's code, no threshold.
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["tests/**", "scripts/**", "evals/**"]
