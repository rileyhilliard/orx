# Git hooks (lefthook 2.x). `bun install` runs `lefthook install` via the prepare script (skipped when CI is set).
# Never bypass with --no-verify: fix the cause, or fix the hook.

pre-commit:
  parallel: false
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      # Formats and applies safe fixes, re-stages them, then fails on anything left.
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commits
      run: |
        msg_file="{1}"
        first_line=$(head -n1 "$msg_file")
        case "$first_line" in
          Merge\ *|Revert\ *|fixup!\ *|squash!\ *) exit 0 ;;
        esac
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
        if printf '%s' "$first_line" | grep -Eq "$pattern"; then
          exit 0
        fi
        echo "Commit message must follow Conventional Commits:"
        echo "  type(scope)!: description"
        echo "  types: feat fix docs style refactor perf test build ci chore revert (scope and ! optional)"
        echo "  example: feat(ask): print token cost after the reply"
        exit 1

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test
