name: Vanilla

# `bun run vanilla` rewrites this repo into a blank-slate CLI from template/vanilla/. The template
# replaces files that main keeps changing, so every change to main checks that the result still
# builds and passes the gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanilla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vanilla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # In a throwaway worktree: delete, copy the template, rename to "demo", then the full gate.
      - run: bun run vanilla -- --verify --name demo
