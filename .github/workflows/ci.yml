name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one required check. Every step calls a package.json script, same as local.
  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the bun version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
      # vitest runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Every platform's OpenTUI native package, so build:all can embed each target's.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run test:tui
      # Builds dist/orx, then drives it in a pseudo-terminal against the stubs.
      - run: bun run e2e
      # Every release target compiles (a cross-compile smoke; release.yml runs them).
      - run: bun run build:all
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            logs/
            coverage/
          retention-days: 7
